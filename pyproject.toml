[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.9.22,<0.10" ]

[project]
name = "anyfetch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [ { name = "envcat", email = "266045439+envcat@users.noreply.github.com" } ]
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "cyclopts>=4.8",
  "platformdirs>=4.9.4",
  "tomlkit>=0.14",
]
scripts.anyfetch = "anyfetch.main:app"

[tool.ruff]
line-length = 120
lint.select = [
  "B",  # flake8-bugbear
  "C4", # flake8-comprehensions
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # isort
  "UP", # pyupgrade
  "W",  # pycodestyle warnings
]

[tool.pyright]
typeCheckingMode = "standard"
include = [ "src/*" ]
venvPath = "."
venv = ".venv"

[tool.rumdl]
disable = [ "MD013" ]
include = [ "docs/*.md", "README.md" ]
exclude = [ ".git", "node_modules" ]
ignore-gitignore = false
MD044.names = [ "rumdl", "Markdown", "GitHub", "JavaScript", "Node.js", "TypeScript" ]
